    - url: "https://github.com/mahmoud/boltons"
      name: "boltons"

# === Mining Parameters ===
mining:
  # Evenly distribute samples across full commit history (matches java_miner.py)
  snapshot_stride: 5             # Kept for compatibility; max_commits takes priority
  max_commits: 500               # Cap per repo — evenly sampled from full history
  min_commits: 50                # Skip repos with fewer commits
  min_rows_for_training: 50      # Fix 0-I: repos producing fewer rows flagged exclude_from_training=1
  # IMPORTANT: future_window is in DAYS (date-based), NOT commit count.
  # Using commit-count caused 75%+ false-positive bug labels on active repos.
  future_window_days: 90         # Look-ahead window: 90 calendar days (same as Java)
  label_rate_min: 0.05           # Fix 0-I: repos below this rate flagged label_outlier=1
  label_rate_max: 0.65           # Fix 0-I: repos above this rate flagged label_outlier=1
  file_extensions:
    - ".py"
  exclude_patterns:
    - "**/test_*.py"             # Test files (optional toggle)
    - "**/tests/**"
    - "**/migrations/**"         # Django/Alembic migrations
    - "**/vendor/**"
    - "**/venv/**"
    - "**/node_modules/**"
    - "**/__pycache__/**"
    - "**/setup.py"              # Often auto-generated
    - "**/conf.py"               # Sphinx config
  max_file_size_kb: 500          # Skip files > 500KB (generated code)

# === Rename Tracking ===
rename_tracking:
  enabled: true
  similarity_threshold: 0.50
  method: "git_log_follow"       # Uses git log --follow

# === Performance ===
performance:
  num_threads: 4                 # PyDriller parallelism
  batch_size: 5                  # Repos per processing batch
  clone_method: "bare"           # Use --bare clones for speed
  stream_to_storage: true        # Write to DuckDB/Parquet as we go

# === Storage ===
storage:
  format: "parquet"              # Primary storage format
  database: "data/smellpredict.duckdb"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  labels_dir: "data/labels"
  external_dir: "data/external"

# === Bug-Fix Labeling Heuristic ===
labeling:
  # Exact weights from paper Equation (1)
  keyword_weight: 0.20
  issue_ref_weight: 0.15
  strong_fix_weight: 0.25
  noise_penalty: 0.15
  score_threshold: 0.40
  keywords:
    - "fix"
    - "fixed"
    - "fixes"
    - "fixing"
    - "bug"
    - "defect"
    - "patch"
    - "regression"
    - "crash"
    - "exception"
    - "failure"
    - "broken"
    - "incorrect"
    - "wrong"
    - "error"
    - "resolve"
    - "resolved"
    - "resolves"
    - "resolving"
    - "repair"
    - "hotfix"
  strong_patterns:
    - "fix(es|ed|ing)?"
    - "bug.?fix"
    - "regression"
    # NOTE: 'patch' removed — causes false positives on repos using
    # Apache SVN-style "patch by X; reviewed by Y" commit messages.
    - "crash"
    - "defect"
    - "null.?pointer"
    - "npe"
    - "deadlock"
    - "memory.?leak"
  noise_patterns:
    - "merge"
    - "format"
    - "typo"
    - "readme"
    - "documentation"
    - "docs"
    - "refactor"
    - "cleanup"
    - "style"
    - "lint"
    # Apache SVN workflow noise
    - "patch by"
    - "reviewed by"
    - "git-svn-id"
    # Structural non-bug commits
    - "move"
    - "rename"
    - "revert"
    - "upgrade"
    - "bump"

# === Code Smell Thresholds ===
smell_thresholds:
  long_method:
    default: 50
    sensitivity: [30, 40, 50, 60, 80]
  long_parameter_list:
    default: 5
    sensitivity: [3, 4, 5, 6, 8]
  large_class:
    default: 300
    sensitivity: [200, 250, 300, 400, 500]
  deep_nesting:
    default: 4
    sensitivity: [3, 4, 5, 6]
  high_cyclomatic_complexity:
    default: 10
    sensitivity: [7, 8, 10, 12, 15]
