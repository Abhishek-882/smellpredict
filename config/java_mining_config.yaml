# SmellPredict — Java Mining Configuration
# Controls repository mining, feature extraction, and snapshot sampling for Java

repositories:
  # === Tier 1: Large Backend & Platform Frameworks (20 repos) ===
  tier1:
    - url: "https://github.com/spring-projects/spring-boot"
      name: "spring-boot"
    - url: "https://github.com/spring-projects/spring-framework"
      name: "spring-framework"
    - url: "https://github.com/apache/kafka"
      name: "kafka"
    - url: "https://github.com/apache/hadoop"
      name: "hadoop"
    - url: "https://github.com/elastic/elasticsearch"
      name: "elasticsearch"
    - url: "https://github.com/netty/netty"
      name: "netty"
    - url: "https://github.com/square/okhttp"
      name: "okhttp"
    - url: "https://github.com/google/guava"
      name: "guava"
    - url: "https://github.com/apache/maven"
      name: "maven"
    - url: "https://github.com/gradle/gradle"
      name: "gradle"
    - url: "https://github.com/apache/cassandra"
      name: "cassandra"
    - url: "https://github.com/apache/zookeeper"
      name: "zookeeper"
    - url: "https://github.com/hibernate/hibernate-orm"
      name: "hibernate-orm"
    - url: "https://github.com/dropwizard/dropwizard"
      name: "dropwizard"
    - url: "https://github.com/micronaut-projects/micronaut-core"
      name: "micronaut-core"
    - url: "https://github.com/quarkusio/quarkus"
      name: "quarkus"
    - url: "https://github.com/eclipse-vertx/vert.x"
      name: "vert.x"
    - url: "https://github.com/resilience4j/resilience4j"
      name: "resilience4j"
    - url: "https://github.com/grpc/grpc-java"
      name: "grpc-java"
    - url: "https://github.com/google/guice"
      name: "guice"

  # === Tier 2: Data Engineering & Streaming (15 repos) ===
  tier2:
    - url: "https://github.com/apache/flink"
      name: "flink"
    - url: "https://github.com/apache/hbase"
      name: "hbase"
    - url: "https://github.com/apache/storm"
      name: "storm"
    - url: "https://github.com/apache/druid"
      name: "druid"
    - url: "https://github.com/hazelcast/hazelcast"
      name: "hazelcast"
    - url: "https://github.com/redisson/redisson"
      name: "redisson"
    - url: "https://github.com/brettwooldridge/HikariCP"
      name: "HikariCP"
    - url: "https://github.com/mybatis/mybatis-3"
      name: "mybatis-3"
    - url: "https://github.com/querydsl/querydsl"
      name: "querydsl"
    - url: "https://github.com/liquibase/liquibase"
      name: "liquibase"
    - url: "https://github.com/flyway/flyway"
      name: "flyway"
    - url: "https://github.com/apache/activemq"
      name: "activemq"
    - url: "https://github.com/apache/pulsar"
      name: "pulsar"
    - url: "https://github.com/debezium/debezium"
      name: "debezium"
    - url: "https://github.com/apache/beam"
      name: "beam"

  # === Tier 3: Security, Testing & Tooling (15 repos) ===
  tier3:
    - url: "https://github.com/keycloak/keycloak"
      name: "keycloak"
    - url: "https://github.com/mockito/mockito"
      name: "mockito"
    - url: "https://github.com/junit-team/junit5"
      name: "junit5"
    - url: "https://github.com/google/truth"
      name: "truth"
    - url: "https://github.com/assertj/assertj-core"
      name: "assertj-core"
    - url: "https://github.com/spotbugs/spotbugs"
      name: "spotbugs"
    - url: "https://github.com/pmd/pmd"
      name: "pmd"
    - url: "https://github.com/checkstyle/checkstyle"
      name: "checkstyle"
    - url: "https://github.com/OpenAPITools/openapi-generator"
      name: "openapi-generator"
    - url: "https://github.com/google/dagger"
      name: "dagger"
    - url: "https://github.com/ReactiveX/RxJava"
      name: "RxJava"
    - url: "https://github.com/square/retrofit"
      name: "retrofit"
    - url: "https://github.com/google/gson"
      name: "gson"
    - url: "https://github.com/FasterXML/jackson-databind"
      name: "jackson-databind"
    - url: "https://github.com/square/moshi"
      name: "moshi"

mining:
  commit_stride: 5              # Sample every 5th commit
  max_commits_per_repo: 500     # Cap commits mined per repo
  snapshot_window_days: 90      # Look-ahead window for bug-fix label
  min_file_size_bytes: 100
  max_file_size_bytes: 524288   # 500 KB

language:
  extensions:
    - ".java"
  exclude_patterns:
    - "Test*.java"
    - "*Tests.java"
    - "*Test.java"
    - "*IT.java"                # Integration tests
    - "*ITCase.java"
    - "*/generated-sources/*"
    - "*/generated/*"
    - "*/protobuf/*"
    - "*/target/*"
    - "*/build/*"
    - "*package-info.java"
    - "*/test/*"
    - "*/tests/*"

output:
  clones_dir: "data/java/clones"
  raw_dir: "data/java/raw"
  db_path: "data/java_smellpredict.duckdb"
  table_name: "java_snapshots"
  log_file: "logs/java_mining.log"
