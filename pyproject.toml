[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smellpredict"
version = "0.1.0"
description = "Code Smell × Bug Prediction Platform — Do code smells improve future bug-fix prediction?"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "SmellPredict Team"},
]

dependencies = [
    # === Mining & Data ===
    "pydriller>=2.6",
    "gitpython>=3.1",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "pandas>=2.2",
    "polars>=1.0",

    # === Code Analysis ===
    "radon>=6.0",

    # === Machine Learning ===
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "optuna>=3.6",
    "imbalanced-learn>=0.12",

    # === Experiment Tracking ===
    "mlflow>=2.14",

    # === Explainability ===
    "shap>=0.45",
    "lime>=0.2",

    # === Statistics ===
    "scipy>=1.13",
    "statsmodels>=0.14",

    # === Visualization ===
    "plotly>=5.22",
    "matplotlib>=3.9",
    "seaborn>=0.13",

    # === Platform ===
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.36",

    # === Phase 18: Collaboration & GitHub Auth ===
    "python-jose[cryptography]>=3.3",   # JWT encode/decode (HS256)
    "cryptography>=42.0",               # Fernet symmetric encryption for GitHub tokens
    "PyGithub>=2.3",                    # GitHub REST API v3 wrapper
    "redis>=5.0",                       # Async Redis client for Y.js state persistence
    "httpx>=0.27",                      # Async HTTP for GitHub OAuth token exchange
    "python-multipart>=0.0.9",          # Form data parsing (OAuth callback)

    # === Utilities ===
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "loguru>=0.7",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
dl = [
    # Deep learning (optional, for Tier 3 models)
    "torch>=2.3",
    "transformers>=4.42",
]

[project.scripts]
smellpredict = "smellpredict.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
