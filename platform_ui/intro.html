<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmellPredict — Defect Intelligence Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100vw; height: 100vh;
            overflow: hidden;
            background: #030712;
            font-family: 'Space Grotesk', sans-serif;
            color: #fff;
            cursor: pointer;
        }

        #c {
            position: fixed;
            inset: 0;
            display: block;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #c-red, #c-blue {
            position: fixed;
            inset: 0;
            display: block;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }

        #c-red  { z-index: 2; mix-blend-mode: screen; opacity: 0; }
        #c-blue { z-index: 3; mix-blend-mode: screen; opacity: 0; }

        .vignette {
            position: fixed; inset: 0; z-index: 4;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(3,7,18,0.92) 100%);
            pointer-events: none;
        }

        #noise {
            position: fixed; inset: 0; z-index: 5;
            pointer-events: none;
            opacity: 0.035;
        }

        #lines {
            position: fixed; inset: 0; z-index: 6;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        #lines.show { opacity: 1; }

        #lines::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(245,158,11,0.2) 25%, rgba(245,158,11,0.2) 75%, transparent);
        }

        #platform-label {
            position: fixed;
            top: 32px; left: 36px;
            z-index: 10;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #platform-label svg {
            width: 16px; height: 16px;
            color: #f59e0b;
        }

        #version-tag {
            position: fixed;
            top: 32px; right: 36px;
            z-index: 10;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 3px;
            color: rgba(245,158,11,0.7);
            text-transform: uppercase;
        }

        #enter-prompt {
            position: fixed;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #fff;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 26px;
            border-radius: 100px;
            border: 1px solid rgba(245,158,11,0.4);
            background: rgba(245,158,11,0.12);
            box-shadow: 0 0 24px rgba(245,158,11,0.25);
            animation: pulseGlow 2s infinite ease-in-out;
        }

        #enter-prompt:hover {
            color: #fff !important;
            transform: translateX(-50%) translateY(-2px);
            background: rgba(245, 158, 11, 0.25);
            border-color: #f59e0b;
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.45);
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(245,158,11,0.2); }
            50% { box-shadow: 0 0 30px rgba(245,158,11,0.45); }
        }

        #enter-prompt svg {
            width: 14px; height: 14px;
            stroke-width: 2;
            animation: arrowBounce 1.8s ease-in-out infinite;
        }

        @keyframes arrowBounce {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(4px); }
        }

        .skip-btn {
            position: fixed;
            bottom: 32px;
            right: 36px;
            z-index: 10;
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            transition: color 0.2s;
        }

        .skip-btn:hover {
            color: #f59e0b;
        }
    </style>
</head>
<body>

    <!-- Fast session check to avoid replaying on reload/back -->
    <script>
    if (sessionStorage.getItem('sp_intro_seen') === 'true' && !window.location.search.includes('replay')) {
        window.location.replace('index.html');
    }
    </script>

    <canvas id="c"></canvas>
    <canvas id="c-red"></canvas>
    <canvas id="c-blue"></canvas>
    <div class="vignette"></div>
    <div id="lines" class="show"></div>

    <div id="platform-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span>Empirical Defect Intelligence</span>
    </div>
    <div id="version-tag">Platform v2.0</div>

    <div id="enter-prompt" onclick="enterPlatform(event)">
        <span>Press Enter / Click to Launch</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>

    <a href="index.html" class="skip-btn" onclick="enterPlatform(event)">Direct Access &rarr;</a>

    <svg id="noise" xmlns="http://www.w3.org/2000/svg">
        <filter id="grain-filter">
            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
            <feColorMatrix type="saturate" values="0"/>
        </filter>
        <rect width="100%" height="100%" filter="url(#grain-filter)"/>
    </svg>

    <script>
    let isEntering = false;
    function enterPlatform(e) {
        if (e && e.stopPropagation) e.stopPropagation();
        if (isEntering) return;
        isEntering = true;
        try { sessionStorage.setItem('sp_intro_seen', 'true'); } catch(err){}
        const ep = document.getElementById('enter-prompt');
        if (ep) {
            ep.style.transition = 'opacity 0.2s ease';
            ep.style.opacity = '0';
        }
        document.body.style.transition = 'opacity 0.25s ease';
        document.body.style.opacity = '0';
        setTimeout(() => { window.location.replace('index.html'); }, 250);
    }

    // 1-Click / 1-Keypress instantaneous entry: zero waiting, zero double press needed!
    window.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown' || e.key === 'Escape') {
            e.preventDefault();
            enterPlatform();
        }
    });

    document.addEventListener('click', enterPlatform);

    (() => {
        'use strict';

        const canvas  = document.getElementById('c');
        const cRed    = document.getElementById('c-red');
        const cBlue   = document.getElementById('c-blue');
        const ctx     = canvas.getContext('2d');
        const ctxR    = cRed.getContext('2d');
        const ctxB    = cBlue.getContext('2d');

        let W = 0, H = 0;
        let mx = 0, my = 0;
        let lx = 0, ly = 0;
        let time = 0;
        let phase = 0;
        let phaseTimer = 0;
        let aberrationAmt = 0;

        const TOTAL = 6500;
        const particles = [];
        let targets = [];

        function resize() {
            W = canvas.width = cRed.width = cBlue.width = window.innerWidth;
            H = canvas.height = cRed.height = cBlue.height = window.innerHeight;
            sampleTextTargets();
        }

        function sampleTextTargets() {
            const tmp = document.createElement('canvas');
            tmp.width = W; tmp.height = H;
            const t2 = tmp.getContext('2d');

            const fontSize = Math.min(W * 0.16, H * 0.32, 190);
            t2.fillStyle = '#fff';
            t2.textAlign = 'center';
            t2.textBaseline = 'middle';
            t2.font = `${fontSize}px 'Bebas Neue', sans-serif`;
            t2.fillText('SmellPredict', W / 2, H / 2);

            const imgData = t2.getImageData(0, 0, W, H).data;
            targets = [];

            const step = Math.max(2, Math.floor(Math.sqrt((W * H) / (TOTAL * 3.5))));
            for (let y = 0; y < H; y += step) {
                for (let x = 0; x < W; x += step) {
                    const idx = (y * W + x) * 4;
                    if (imgData[idx + 3] > 120) {
                        targets.push({ x, y });
                    }
                }
            }
        }

        function initParticles() {
            particles.length = 0;
            const count = Math.min(TOTAL, targets.length > 0 ? targets.length * 2 : TOTAL);

            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist  = Math.max(W, H) * (0.6 + Math.random() * 0.8);
                const ox    = W / 2 + Math.cos(angle) * dist;
                const oy    = H / 2 + Math.sin(angle) * dist;

                const smell = Math.random() < 0.18;

                particles.push({
                    x: ox, y: oy,
                    vx: (Math.random() - 0.5) * 40,
                    vy: (Math.random() - 0.5) * 40,
                    tx: 0, ty: 0,
                    ox, oy,
                    size: Math.random() < 0.08 ? 2.5 : Math.random() < 0.3 ? 1.8 : 1.0,
                    alpha: Math.random() * 0.6 + 0.2,
                    baseAlpha: Math.random() * 0.5 + 0.3,
                    smell,
                    color: smell ? '#f59e0b' : '#10b981',
                    arrived: false,
                    noiseOffset: Math.random() * 1000,
                    speed: 0.8 + Math.random() * 0.6
                });
            }

            assignTargets();
        }

        function assignTargets() {
            if (targets.length === 0) return;
            const shuffled = targets.slice().sort(() => Math.random() - 0.5);
            for (let i = 0; i < particles.length; i++) {
                const t = shuffled[i % shuffled.length];
                particles[i].tx = t.x + (Math.random() - 0.5) * 2;
                particles[i].ty = t.y + (Math.random() - 0.5) * 2;
            }
        }

        function update(dt) {
            time += dt;
            phaseTimer += dt;

            lx += (mx - lx) * 0.05;
            ly += (my - ly) * 0.05;

            if (phase === 0 && phaseTimer > 0.4) {
                phase = 1;
                phaseTimer = 0;
            } else if (phase === 1 && phaseTimer > 2.0) {
                phase = 2;
                phaseTimer = 0;
            }

            aberrationAmt = 0;

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];

                if (phase === 0) {
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                } else if (phase === 1) {
                    const dx = p.tx - p.x;
                    const dy = p.ty - p.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    const ease = Math.min(phaseTimer / 1.6, 1.0);
                    const k = 4.5 * p.speed * ease;
                    p.vx += dx * k * dt - p.vx * 3.5 * dt;
                    p.vy += dy * k * dt - p.vy * 3.5 * dt;

                    p.x += p.vx * dt;
                    p.y += p.vy * dt;

                    if (dist < 4) p.arrived = true;
                } else {
                    const dx = p.tx - p.x;
                    const dy = p.ty - p.y;
                    p.x += dx * 0.12;
                    p.y += dy * 0.12;

                    const ndx = mx - p.x;
                    const ndy = my - p.y;
                    const ndist = Math.sqrt(ndx * ndx + ndy * ndy);
                    if (ndist < 90) {
                        const rep = (1 - ndist / 90) * 20;
                        p.x -= (ndx / ndist) * rep;
                        p.y -= (ndy / ndist) * rep;
                    }
                }
            }
        }

        function draw() {
            ctx.fillStyle = 'rgba(3, 7, 18, 0.35)';
            ctx.fillRect(0, 0, W, H);

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                if (p.alpha <= 0) continue;

                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size * 0.5, p.y - p.size * 0.5, p.size, p.size);
            }
            ctx.globalAlpha = 1;
        }

        let lastT = 0;
        function loop(ts) {
            const dt = Math.min((ts - lastT) / 1000, 0.05);
            lastT = ts;
            update(dt);
            draw();
            if (!isEntering) requestAnimationFrame(loop);
        }

        window.addEventListener('mousemove', e => {
            mx = e.clientX;
            my = e.clientY;
        });

        window.addEventListener('touchmove', e => {
            mx = e.touches[0].clientX;
            my = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('resize', () => {
            resize();
            initParticles();
        });

        document.fonts.ready.then(() => {
            resize();
            initParticles();
            mx = W / 2; my = H / 2;
            lx = mx; ly = my;
            requestAnimationFrame(ts => { lastT = ts; loop(ts); });
        });
    })();
    </script>
</body>
</html>
